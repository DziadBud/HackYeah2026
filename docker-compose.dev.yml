# Frontend hot reload only. api/rag stay on production images from docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#

services:
  web:
    build:
      context: ./frontend
      target: deps
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}}
    working_dir: /app
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    command:
      [
        "sh",
        "-c",
        "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000",
      ]

volumes:
  web_node_modules:
