services:
  db:
    image: pgvector/pgvector:pg17
    container_name: hackyeah-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hackyeah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackyeah}
      POSTGRES_DB: ${POSTGRES_DB:-hackyeah}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # file mounts only (directory+files into the same path breaks on Docker Desktop)
      - ./docker/postgres/init/01-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
      - ./rag/sql/001_rag_chunks.sql:/docker-entrypoint-initdb.d/02-rag_chunks.sql:ro
      - ./rag/sql/002_parent_metadata.sql:/docker-entrypoint-initdb.d/03-parent_metadata.sql:ro
      - ./rag/sql/003_parent_links.sql:/docker-entrypoint-initdb.d/04-parent_links.sql:ro
      - ./rag/sql/004_localization.sql:/docker-entrypoint-initdb.d/05-localization.sql:ro
      - ./rag/sql/005_city.sql:/docker-entrypoint-initdb.d/06-city.sql:ro
      - ./rag/sql/006_innovations.sql:/docker-entrypoint-initdb.d/07-innovations.sql:ro
      - ./backend/sql/001_innovations_extend.sql:/docker-entrypoint-initdb.d/08-innovations_extend.sql:ro
      - ./backend/sql/002_problem_reports.sql:/docker-entrypoint-initdb.d/09-problem_reports.sql:ro
      - ./backend/sql/003_ideas.sql:/docker-entrypoint-initdb.d/10-ideas.sql:ro
      - ./backend/sql/004_grant_calls.sql:/docker-entrypoint-initdb.d/11-grant_calls.sql:ro
      - ./backend/sql/005_test_signups.sql:/docker-entrypoint-initdb.d/12-test_signups.sql:ro
      - ./backend/sql/006_feedback.sql:/docker-entrypoint-initdb.d/13-feedback.sql:ro
      - ./backend/sql/007_threads.sql:/docker-entrypoint-initdb.d/14-threads.sql:ro
      - ./backend/sql/008_thread_replies.sql:/docker-entrypoint-initdb.d/15-thread_replies.sql:ro
      - ./backend/sql/009_generated_documents.sql:/docker-entrypoint-initdb.d/16-generated_documents.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hackyeah} -d ${POSTGRES_DB:-hackyeah}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: hackyeah-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hackyeah}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-hackyeah}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      # management ui
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: hackyeah-api
    environment:
      DEBUG: ${DEBUG:-true}
      ADMIN_ACCOUNTS: ${ADMIN_ACCOUNTS:-{}}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hackyeah}:${POSTGRES_PASSWORD:-hackyeah}@db:5432/${POSTGRES_DB:-hackyeah}
      # hackathon demo: admin panel without login (only works with DEBUG=true)
      ADMIN_AUTH_DISABLED: ${ADMIN_AUTH_DISABLED:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-hackyeah}:${RABBITMQ_PASSWORD:-hackyeah}@rabbitmq:5672/
      UPLOAD_DIR: /data/uploads
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # the rag consumer must mount the same volume at /data/uploads to read the pdfs
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: hackyeah-embeddings
    command:
      - --model-id
      - ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - --port
      - "80"
    volumes:
      - embedding_models:/data

  ollama:
    image: ollama/ollama:latest
    container_name: hackyeah-ollama
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama:latest
    container_name: hackyeah-ollama-init
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $${OLLAMA_MODEL:-qwen2.5:1.5b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_models:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy

  rag:
    build: ./rag
    container_name: hackyeah-rag
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hackyeah}:${POSTGRES_PASSWORD:-hackyeah}@db:5432/${POSTGRES_DB:-hackyeah}
      EMBEDDING_SERVICE_URL: http://embeddings:80/embed
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    ports:
      - "${RAG_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
      embeddings:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* is baked at build time, so the browser must reach the api
      # directly (published on the host), not the compose-internal hostname.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}}
    container_name: hackyeah-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  rabbitmq_data:
  uploads:
  embedding_models:
  ollama_models:
