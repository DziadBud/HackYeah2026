services:
  db:
    image: pgvector/pgvector:pg17
    container_name: hackyeah-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hackyeah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackyeah}
      POSTGRES_DB: ${POSTGRES_DB:-hackyeah}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hackyeah} -d ${POSTGRES_DB:-hackyeah}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: hackyeah-api
    environment:
      DEBUG: ${DEBUG:-true}
      ADMIN_ACCOUNTS: ${ADMIN_ACCOUNTS:-{}}
      # hackathon demo: admin panel without login (only works with DEBUG=true)
      ADMIN_AUTH_DISABLED: ${ADMIN_AUTH_DISABLED:-true}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hackyeah}:${POSTGRES_PASSWORD:-hackyeah}@db:5432/${POSTGRES_DB:-hackyeah}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hackyeah}:${POSTGRES_PASSWORD:-hackyeah}@db:5432/${POSTGRES_DB:-hackyeah}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* is baked at build time, so the browser must reach the api
      # directly (published on the host), not the compose-internal hostname.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}}
    container_name: hackyeah-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres_data:
