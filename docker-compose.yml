services:
  db:
    image: pgvector/pgvector:pg17
    container_name: hackyeah-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hackyeah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackyeah}
      POSTGRES_DB: ${POSTGRES_DB:-hackyeah}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hackyeah} -d ${POSTGRES_DB:-hackyeah}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: hackyeah-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hackyeah}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-hackyeah}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      # management ui
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # single place that applies the schema: rag/sql (rag's tables) then backend/sql (match-api's).
  # runs on every up, so every file must be idempotent
  migrate:
    image: pgvector/pgvector:pg17
    container_name: hackyeah-migrate
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-hackyeah}
      PGPASSWORD: ${POSTGRES_PASSWORD:-hackyeah}
      PGDATABASE: ${POSTGRES_DB:-hackyeah}
      # hide "already exists, skipping" notices on re-runs
      PGOPTIONS: -c client_min_messages=warning
    volumes:
      - ./rag/sql:/sql/rag:ro
      - ./backend/sql:/sql/backend:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        psql -v ON_ERROR_STOP=1 -q -c "CREATE EXTENSION IF NOT EXISTS vector"
        for f in /sql/rag/*.sql /sql/backend/*.sql; do
          echo "=== $$f"
          psql -v ON_ERROR_STOP=1 -q -f "$$f"
        done
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    container_name: hackyeah-api
    environment:
      # +psycopg: only psycopg 3 is installed
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hackyeah}:${POSTGRES_PASSWORD:-hackyeah}@db:5432/${POSTGRES_DB:-hackyeah}
      # safe by default: no /docs, admin login required. set these in the root .env for local dev
      DEBUG: ${DEBUG:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # empty means nobody can log in to /admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # skips the admin login; honoured only with DEBUG=true
      ADMIN_AUTH_DISABLED: ${ADMIN_AUTH_DISABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      RAG_URL: http://rag:8000
      # notifications; without SMTP_HOST mails are only logged. set these in the root .env
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-}
      # testing: every mail goes only here
      MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO:-}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rag:
        condition: service_healthy

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: hackyeah-embeddings
    command:
      - --model-id
      - ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - --port
      - "80"
    volumes:
      - embedding_models:/data

  ollama:
    image: ollama/ollama:latest
    container_name: hackyeah-ollama
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama:latest
    container_name: hackyeah-ollama-init
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $${OLLAMA_MODEL:-qwen2.5:1.5b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_models:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy

  rag:
    build: ./rag
    container_name: hackyeah-rag
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hackyeah}:${POSTGRES_PASSWORD:-hackyeah}@db:5432/${POSTGRES_DB:-hackyeah}
      EMBEDDING_SERVICE_URL: http://embeddings:80/embed
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      MATCH_MIN_SCORE: ${MATCH_MIN_SCORE:-0.15}
    ports:
      - "${RAG_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      embeddings:
        condition: service_started
      # ollama is optional (tagging / grounded answers). embeddings do not need it.
      # start ollama separately if you want those features: docker compose up ollama ollama-init
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* is baked at build time, so the browser must reach the api
      # directly (published on the host), not the compose-internal hostname.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}}
    container_name: hackyeah-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  rabbitmq_data:
  uploads:
  embedding_models:
  ollama_models:
